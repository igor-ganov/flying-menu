name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Requires a Trusted Publisher configured on npmjs.com for this package:
#   org igor-ganov · repo flying-menu · workflow publish.yml · action "npm publish".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC identity for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # >= 22.14 required
          # No registry-url: it would write a token-auth .npmrc that disables OIDC.
      - name: Use npm >= 11.5.1 (Trusted Publishing)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # `prepublishOnly` runs typecheck + lint + unit tests + build first.
      # OIDC handles auth (no token); provenance is generated automatically.
      - run: npm publish --access public
