<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flying Menu — demo</title>
    <style>
      :root {
        --surface: #1f2430;
        --accent: #4f7cff;
        --text: #e6e9ef;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #0d1017;
        color: var(--text);
      }
      main {
        padding: 2rem;
        max-width: 40rem;
      }
      /* Consumer-owned visual styling of the headless component via parts. */
      flying-menu::part(menu) {
        background: var(--surface);
        border: 1px solid #333a48;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        padding: 0.5rem;
        min-width: 12rem;
      }
      .hamburger {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 1.4rem;
        cursor: pointer;
      }
      .big-trigger {
        padding: 1rem 2rem;
        border-radius: 12px;
        border: none;
        background: #8b5cf6;
        color: white;
        font-size: 1.1rem;
        cursor: pointer;
      }
      nav.menu {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      nav.menu a {
        color: var(--text);
        text-decoration: none;
        padding: 0.6rem 0.8rem;
        border-radius: 8px;
      }
      nav.menu a:hover,
      nav.menu a:focus-visible {
        background: #2c3340;
        outline: 2px solid var(--accent);
      }
      .tall-menu a {
        display: block;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Flying Menu</h1>
      <p>Drag the floating trigger to any corner, then tap to open the menu.</p>
      <p data-testid="hint">Scenario controlled via query string: <code>?scenario=big</code>.</p>
    </main>

    <!-- Default scenario: small round trigger + short menu. -->
    <flying-menu id="primary" data-testid="primary">
      <button slot="trigger" class="hamburger" aria-label="Open navigation" data-testid="trigger">
        ☰
      </button>
      <nav slot="menu" class="menu" aria-label="Primary" data-testid="menu">
        <a href="#home" data-testid="item-home">Home</a>
        <a href="#docs" data-testid="item-docs">Docs</a>
        <a href="#about" data-testid="item-about">About</a>
      </nav>
    </flying-menu>

    <script type="module">
      import './src/flying-menu.ts'

      const params = new URLSearchParams(location.search)
      const menu = document.querySelector('#primary')

      // Optional large-trigger / tall-menu scenario for overflow + size-independence tests.
      if (params.get('scenario') === 'big') {
        menu.querySelector('[slot="trigger"]').outerHTML =
          '<button slot="trigger" class="big-trigger" data-testid="trigger">Big custom trigger ▾</button>'
        const nav = menu.querySelector('[slot="menu"]')
        nav.classList.add('tall-menu')
        nav.innerHTML = Array.from({ length: 18 }, (_, i) =>
          `<a href="#row-${i}" data-testid="item-${i}">Menu row ${i + 1}</a>`
        ).join('')
      }

      if (params.has('corner')) menu.setAttribute('corner', params.get('corner'))
      if (params.has('no-persist')) menu.setAttribute('no-persist', '')
      if (params.has('storage-key')) menu.setAttribute('storage-key', params.get('storage-key'))

      // Expose last events for assertions without timeouts.
      menu.addEventListener('flying-menu-toggle', (e) => {
        menu.dataset.lastToggle = String(e.detail.open)
      })
      menu.addEventListener('flying-menu-corner', (e) => {
        menu.dataset.lastCorner = e.detail.corner
      })
    </script>
  </body>
</html>
